[package]
name = "ph-reactor"
version = "1.7.0"
edition = "2021"
rust-version = "1.83"
description = "Native Rust event-sourced document store and libp2p drive sync, with a status-bar tray, a web console, and a synced group shared space"
license = "SEE LICENSE IN LICENSE"

[workspace]
members = ["views"]
resolver = "2"

[lib]
name = "ph_reactor"
path = "src/lib.rs"

[[bin]]
name = "ph-reactor"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = [
  "rt-multi-thread",
  "macros",
  "process",
  "signal",
  "time",
  "fs",
  "io-util",
  "sync",
  "net",
] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "json",
] }
zbus = "4"
axum = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
  "env-filter",
  "local-time",
  "registry",
] }
dirs = "5"
thiserror = "1"
anyhow = "1"
async-trait = "0.1"
futures-util = "0.3"
parking_lot = "0.12"
hex = "0.4"
libc = "0.2"
ed25519-dalek = "2"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
getrandom = "0.2"
base64 = "0.22"
libp2p = { version = "0.56", default-features = false, features = [
  "tokio",
  "tcp",
  "noise",
  "yamux",
  "gossipsub",
  "mdns",
  "ed25519",
  "request-response",
  "macros",
  "identify",
  "kad",
  "relay",
  "websocket",
  "dns",
] }

[features]
quic = ["libp2p/quic"]

[dev-dependencies]
tempfile = "3"
ed25519-dalek = "2"
# Lets the asset-server security tests drive the router as a real HTTP service
# and assert what it returns, rather than inspecting the source for route names.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
strip = "symbols"
lto = "thin"
