<!--
  Drive — a folder tree for a space.

  `items` is a flat array of {name, kind, model, parent}; `parent` names the
  enclosing folder or is null at the root. The tree is derived here rather than
  stored nested, because a nested structure edited concurrently by two people
  merges badly and a flat list with a parent pointer does not.

  Adding answers to the space's members, removing to its managers. Neither list
  lives in this package: the store checks both against the space document.
-->
<!doctype html>
<meta charset="utf-8">
<title>Drive</title>
<style>
  :root {
    --bg: #0b0e14; --raise: #141821; --sunk: #0e1219;
    --ink: #e9edf5; --muted: #9aa3b8; --faint: #6b7489;
    --line: #222836; --line-2: #2f3646;
    --accent: #38e1ff; --accent-ink: #04121a; --violet: #a78bfa;
    --ok: #43e0a0; --warn: #ffc46b; --bad: #ff6b81;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    display: grid; grid-template-rows: auto auto 1fr; height: 100vh;
  }

  .head { padding: 18px 24px 0; }
  .head h1 { margin: 0 0 3px; font-size: 17px; font-weight: 700; }
  .audience { display: flex; align-items: flex-start; gap: 8px; font-size: 11.5px; line-height: 1.45; color: var(--muted); }
  .audience .tier {
    flex: 0 0 auto; font-size: 9px; letter-spacing: 0.07em; text-transform: uppercase;
    padding: 2px 6px; border-radius: 999px; border: 1px solid currentColor; font-weight: 700;
  }
  .tier.public { color: var(--accent); }
  .tier.protected { color: var(--warn); }
  .tier.private { color: var(--bad); }

  .bar { display: flex; align-items: center; gap: 10px; padding: 14px 24px; border-bottom: 1px solid var(--line); }
  .crumbs { flex: 1; display: flex; align-items: center; gap: 6px; font-size: 13px; min-width: 0; flex-wrap: wrap; }
  .crumb { background: none; border: 0; color: var(--muted); font: inherit; cursor: pointer; padding: 3px 6px; border-radius: 6px; }
  .crumb:hover { color: var(--ink); background: rgba(120,140,200,0.08); }
  .crumb.here { color: var(--ink); font-weight: 700; cursor: default; }
  .crumb.here:hover { background: none; }
  .sep { color: var(--faint); font-size: 11px; }
  button.act {
    background: var(--raise); color: var(--ink); border: 1px solid var(--line-2);
    border-radius: 9px; padding: 7px 13px; font: inherit; font-size: 12.5px; cursor: pointer;
  }
  button.act:hover { border-color: var(--accent); color: var(--accent); }
  button.act.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }

  .list { overflow-y: auto; padding: 10px 16px 28px; }
  .item {
    display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 12px;
    padding: 11px 12px; border-radius: 10px; border: 1px solid transparent; cursor: default;
  }
  .item:hover { background: var(--raise); border-color: var(--line); }
  .item.folder { cursor: pointer; }
  .glyph { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-size: 14px; background: rgba(120,140,200,0.10); }
  .item.folder .glyph { color: var(--accent); }
  .item.doc .glyph { color: var(--violet); font-size: 17px; }
  .nm { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub { color: var(--faint); font-size: 11.5px; font-family: var(--mono); }
  .rm { opacity: 0; background: none; border: 0; color: var(--faint); font: inherit; font-size: 12px; cursor: pointer; padding: 5px 9px; border-radius: 7px; }
  .item:hover .rm { opacity: 1; }
  .rm:hover { color: var(--bad); background: rgba(255,107,129,0.10); }
  .tail { display: flex; align-items: center; gap: 4px; }
  .chev { color: var(--faint); font-size: 16px; width: 14px; text-align: center; }
  .item.folder:hover .chev { color: var(--accent); }

  .empty { color: var(--muted); text-align: center; padding: 60px 24px; }
  .empty .big { font-size: 26px; opacity: 0.5; margin-bottom: 10px; }
  .empty strong { display: block; color: var(--ink); font-size: 15px; margin-bottom: 5px; font-weight: 600; }
  .err { color: var(--bad); font-size: 12px; padding: 0 24px 12px; white-space: pre-wrap; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
</style>

<div class="head">
  <h1 id="title">Drive</h1>
  <div class="audience" id="audience" hidden></div>
</div>
<div class="bar">
  <div class="crumbs" id="crumbs"></div>
  <button class="act" id="new-folder">+ Folder</button>
  <button class="act primary" id="new-doc">+ Document</button>
</div>
<div class="list" id="list"></div>
<div class="err" id="err" hidden></div>

<script>
<!--#include ph-reactor-sdk.js-->

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const client = createClient();
let SPACE = null;
let DRIVE = null;          // the drive document for this space
let ITEMS = [];
let PATH = [];             // folder names from the root down
let stop = null;

const fail = (e) => { $("#err").textContent = (e && e.message) || String(e); $("#err").hidden = false; };
const clearFail = () => { $("#err").hidden = true; };

function showAudience() {
  const el = $("#audience");
  if (!SPACE) { el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = `<span class="tier ${esc(SPACE.tier)}">${esc(SPACE.tier)}</span><span>${esc(SPACE.meaning)}</span>`;
}

const here = () => (PATH.length ? PATH[PATH.length - 1] : null);

function renderCrumbs() {
  const parts = [`<button class="crumb${PATH.length ? "" : " here"}" data-d="0">Drive</button>`];
  PATH.forEach((p, i) => {
    parts.push(`<span class="sep">›</span>`);
    parts.push(`<button class="crumb${i === PATH.length - 1 ? " here" : ""}" data-d="${i + 1}">${esc(p)}</button>`);
  });
  $("#crumbs").innerHTML = parts.join("");
  document.querySelectorAll("#crumbs .crumb").forEach((b) => (b.onclick = () => {
    PATH = PATH.slice(0, Number(b.dataset.d));
    render();
  }));
}

function render() {
  renderCrumbs();
  const parent = here();
  const rows = ITEMS.filter((i) => (i.parent || null) === parent);
  // Folders first, then documents, each alphabetical: a listing whose order
  // changes with insertion time is a listing nobody can scan twice.
  rows.sort((a, b) => (a.kind === b.kind ? String(a.name).localeCompare(String(b.name)) : a.kind === "folder" ? -1 : 1));

  const list = $("#list");
  if (!rows.length) {
    list.innerHTML = PATH.length
      ? `<div class="empty"><div class="big">▥</div><strong>This folder is empty.</strong>Add a document or another folder.</div>`
      : `<div class="empty"><div class="big">▥</div><strong>Nothing in the drive yet.</strong>
         Everything you add here is signed and replicated to exactly the people this space allows.</div>`;
    return;
  }
  list.innerHTML = rows.map((i) => {
    const isFolder = i.kind === "folder";
    const kids = isFolder ? ITEMS.filter((x) => x.parent === i.name).length : 0;
    return `<div class="item ${isFolder ? "folder" : "doc"}" data-n="${esc(i.name)}" data-k="${esc(i.kind)}">
      <div class="glyph">${isFolder ? "▤" : "≡"}</div>
      <div>
        <div class="nm">${esc(i.name)}</div>
        <div class="sub">${isFolder ? `${kids} item${kids === 1 ? "" : "s"}` : esc(i.model || "note@1")}</div>
      </div>
      <div class="tail">
        <button class="rm" data-rm="${esc(i.name)}" title="Remove — managers only">Remove</button>
        ${isFolder ? `<span class="chev">›</span>` : ""}
      </div>
    </div>`;
  }).join("");

  document.querySelectorAll(".item.folder").forEach((el) => (el.onclick = (e) => {
    if (e.target.closest("[data-rm]")) return;
    PATH = PATH.concat([el.dataset.n]);
    render();
  }));
  document.querySelectorAll("[data-rm]").forEach((b) => (b.onclick = (e) => { e.stopPropagation(); remove(b.dataset.rm); }));
}

async function ensureDrive() {
  const rows = await client.query("drive@1", null);
  DRIVE = (rows || [])[0] || null;
  if (!DRIVE) {
    // One drive per space, created on first use rather than demanded up front.
    await client.submit("drive@1", "init", "drive", { name: "drive" });
    DRIVE = ((await client.query("drive@1", null)) || [])[0] || null;
  }
  ITEMS = (DRIVE && DRIVE.fields && DRIVE.fields.items) || [];
}

async function add(kind) {
  const what = kind === "folder" ? "Folder name" : "Document name";
  const raw = prompt(what);
  if (!raw || !raw.trim()) return;
  const name = raw.trim();
  clearFail();
  try {
    // A "document" is a real document, not a label in a list. It is created
    // first: if that is refused, nothing is recorded, rather than leaving an
    // entry pointing at something that does not exist.
    if (kind === "doc") {
      await client.submit("note@1", "init", name, { name, title: name, body: "" });
    }
    await client.submit("drive@1", "add-item", DRIVE.name, {
      item: { name, kind, model: kind === "doc" ? "note@1" : null, parent: here() },
    });
    await refresh();
  } catch (e) { fail(e); }
}

async function remove(name) {
  clearFail();
  // Recompute and set the whole array: that is the shape the model's
  // remove-item takes, and it converges under the store's canonical fold.
  const remaining = ITEMS.filter((i) => i.name !== name && i.parent !== name);
  try {
    await client.submit("drive@1", "remove-item", DRIVE.name, { items: remaining });
    await refresh();
  } catch (e) { fail(e); }
}

async function refresh() {
  const rows = await client.query("drive@1", null);
  DRIVE = (rows || [])[0] || DRIVE;
  ITEMS = (DRIVE && DRIVE.fields && DRIVE.fields.items) || [];
  render();
}

(async function boot() {
  try {
    const h = await client.host();
    SPACE = h.space || null;
  } catch {}
  showAudience();
  if (SPACE) $("#title").textContent = "Drive · " + SPACE.name;

  try { await ensureDrive(); } catch (e) { fail(e); }
  render();

  stop = client.useQuery("drive@1", null, (rows) => {
    const d = (rows || [])[0];
    if (!d) return;
    DRIVE = d;
    ITEMS = (d.fields && d.fields.items) || [];
    render();
  }, { everyMs: 4000 });

  $("#new-folder").onclick = () => add("folder");
  $("#new-doc").onclick = () => add("doc");
})();
</script>
