<svg xmlns="http://www.w3.org/2000/svg" width="114" height="114" viewBox="0 0 114 114">
  <!-- The Powerhouse logomark: the square glyph from the full lockup, with the
       "Powerhouse" wordmark removed. Monochrome and theme-aware on purpose -
       a tray icon has to read on both a light and a dark panel.

       Recolouring: KDE rewrites the .ColorScheme-Text rule with the active
       scheme colour; GNOME recolours symbolic icons directly. currentColor
       satisfies both, and the literal below is the fallback when neither does.
  -->
  <style id="current-color-scheme" type="text/css">.ColorScheme-Text { color: #232629; }</style>
