name: ph-reactor
base: core24
version: "1.0.0"
summary: Local Powerhouse reactor with a tray icon
description: |
  Runs the Powerhouse reactor in the background: a single native Rust
  process that keeps remote knowledge-vault drives (e.g. the
  powerhouse-knowledge vault) mirrored locally over a libp2p p2p mesh
  (gossip + catch-up), with no separate Node.js runtime. A status-bar tray
  icon (StatusNotifierItem) shows reactor and drive state; the menu and the
  local settings page (http://127.0.0.1:4002/) configure drives — including
  joining a vault with a one-shot signed invite (ph-reactor invite / join).
  All state lives under $SNAP_USER_DATA/ph-reactor
  (~/.ph/reactor outside the snap).
grade: stable
confinement: strict

apps:
  ph-reactor:
    command: bin/ph-reactor run --daemonize
    autostart: ph-reactor
    environment:
      PH_REACTOR_STATE_DIR: $SNAP_USER_DATA/ph-reactor
    plugs:
      - home
      - network
      - network-bind
      - dbus

desktop:
  ph-reactor:
    name: Powerhouse Reactor
    comment: Runs the local Powerhouse switchboard in the background
    categories:
      - Network
      - Utility
    Terminal: "false"
    Environment: PH_REACTOR_STATE_DIR=$SNAP_USER_DATA/ph-reactor

parts:
  # The binary is a static musl build; CI builds it into dist/ before
  # running snapcraft (see README "Build the snap").
  ph-reactor:
    plugin: nil
    override-build: |
      set -ex
      test -x $CRAFT_PROJECT_DIR/dist/ph-reactor
      install -Dm755 $CRAFT_PROJECT_DIR/dist/ph-reactor $CRAFT_PART_INSTALL/bin/ph-reactor
