name: ph-reactor
base: core24
version: "0.1.0"
summary: Local Powerhouse switchboard with a tray icon
description: |
  Runs a Powerhouse switchboard in the background. On first run it
  bootstraps a private Node.js runtime and the @powerhousedao/switchboard
  package, then keeps a remote knowledge-vault drive (e.g. the
  powerhouse-knowledge vault) mirrored locally. A status-bar tray icon
  (StatusNotifierItem) shows switchboard and drive state; the menu and the
  local settings page (http://127.0.0.1:4002/) configure drives. All state
  lives under $SNAP_USER_DATA/ph-reactor (~/.ph/reactor outside the snap).
grade: stable
confinement: strict

apps:
  ph-reactor:
    command: bin/ph-reactor run --daemonize
    autostart: ph-reactor
    environment:
      PH_REACTOR_STATE_DIR: $SNAP_USER_DATA/ph-reactor
    plugs:
      - home
      - network
      - network-bind
      - dbus

desktop:
  ph-reactor:
    name: Powerhouse Reactor
    comment: Runs the local Powerhouse switchboard in the background
    categories:
      - Network
      - Utility
    Terminal: "false"
    Environment: PH_REACTOR_STATE_DIR=$SNAP_USER_DATA/ph-reactor

parts:
  # The binary is a static musl build; CI builds it into dist/ before
  # running snapcraft (see README "Build the snap").
  ph-reactor:
    plugin: nil
    override-build: |
      set -ex
      test -x $CRAFT_PROJECT_DIR/dist/ph-reactor
      install -Dm755 $CRAFT_PROJECT_DIR/dist/ph-reactor $CRAFT_PART_INSTALL/bin/ph-reactor
