# Container image builds for ph-reactor.
#
# Runs on the same `ph-reactor-v<semver>` tags as release.yml and builds the
# identical static musl binary, so the image, the GitHub release asset and
# the snap all wrap one artifact.
#
# Pushes to Harbor (cr.vetra.io), which is where every workload in the
# powerhouse-k8s-hosting cluster pulls from.
#
# Requires repository secrets HARBOR_USERNAME / HARBOR_PASSWORD.
name: Image

on:
  push:
    tags:
      - "ph-reactor-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable, musl target) + the musl C toolchain
        run: |
          rustup toolchain install stable
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Cache cargo registry and target dir
        uses: Swatinem/rust-cache@v2
        with:
          key: musl

      - name: Build the static binary
        env:
          # cc-rs builds ring for the musl target; point it at musl-gcc so the
          # binary stays fully static (same rationale as release.yml).
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-musl
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/ph-reactor dist/ph-reactor
          # A dynamically linked binary cannot run on distroless/static, and
          # the failure mode is an exec error with no useful message. musl
          # release builds report "static-pie linked", so assert the property
          # rather than one spelling of it.
          desc="$(file -b dist/ph-reactor)"
          echo "linkage: $desc"
          case "$desc" in
            *"dynamically linked"*) echo "::error::binary is dynamically linked"; exit 1 ;;
            *"static-pie linked"*|*"statically linked"*) ;;
            *) echo "::error::could not determine linkage"; exit 1 ;;
          esac

      - name: Derive image tags
        id: tags
        run: |
          version="${GITHUB_REF_NAME#ph-reactor-v}"
          # workflow_dispatch has no tag; without this the image would be
          # pushed under a branch name such as "main".
          if [ "$version" = "$GITHUB_REF_NAME" ]; then version="0.0.0-dev"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: cr.vetra.io
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            cr.vetra.io/powerhouse-inc-powerhouse/ph-reactor:${{ steps.tags.outputs.version }}
            cr.vetra.io/powerhouse-inc-powerhouse/ph-reactor:${{ steps.tags.outputs.sha }}
          # No buildx cache on purpose. It would need the docker-container
          # driver (setup-buildx-action) and would buy nothing: the Dockerfile
          # only copies an already-built binary. The expensive work is the
          # cargo build above, which is cached by rust-cache instead.
