<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reactor</title>
<style>
  :root {
    --bg: #070a12;
    --bg-2: #0b0f1c;
    --panel: rgba(20, 27, 45, 0.66);
    --panel-2: rgba(28, 36, 60, 0.55);
    --line: rgba(120, 140, 200, 0.16);
    --line-2: rgba(120, 140, 200, 0.30);
    --text: #e6ecff;
    --muted: #8b95b5;
    --dim: #5b6488;
    --cyan: #38e1ff;
    --violet: #a78bfa;
    --green: #43e0a0;
    --amber: #ffc46b;
    --red: #ff6b81;
    --glow-cyan: 0 0 22px rgba(56, 225, 255, 0.35);
    --glow-violet: 0 0 22px rgba(167, 139, 250, 0.35);
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(1200px 700px at 78% -10%, rgba(56, 225, 255, 0.10), transparent 60%),
      radial-gradient(1000px 700px at 8% 108%, rgba(167, 139, 250, 0.12), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    overflow: hidden;
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(120,140,200,0.25); border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  button { font-family: inherit; }

  .shell { display: grid; grid-template-columns: 232px 1fr; height: 100vh; }

  /* ---- sidebar ---- */
  .sidebar {
    background: linear-gradient(180deg, var(--bg-2), var(--bg));
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    padding: 18px 14px;
    gap: 4px;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 10px 18px;
  }
  .brand .logo {
    width: 30px; height: 30px; border-radius: 9px;
    background: linear-gradient(135deg, var(--cyan), var(--violet));
    display: grid; place-items: center;
    font-weight: 800; color: #04121a; font-size: 15px;
    box-shadow: var(--glow-cyan);
  }
  .brand .name { font-weight: 700; letter-spacing: 0.04em; font-size: 15px; }
  .brand .name small { display: block; font-weight: 500; color: var(--dim); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; }
  .nav-item {
    display: flex; align-items: center; gap: 11px;
    padding: 9px 12px; border-radius: 10px; cursor: pointer;
    color: var(--muted); font-weight: 500; border: 1px solid transparent;
    transition: all 0.16s ease; user-select: none;
  }
  .nav-item .ico { width: 18px; text-align: center; font-size: 15px; opacity: 0.9; }
  .nav-item:hover { background: rgba(120,140,200,0.07); color: var(--text); }
  .nav-item.active {
    background: linear-gradient(90deg, rgba(56,225,255,0.12), rgba(167,139,250,0.08));
    border-color: var(--line-2); color: var(--text);
  }
  .nav-item.active .ico { color: var(--cyan); }
  .sidebar .foot { margin-top: auto; padding: 10px 12px; font-size: 11px; color: var(--dim); }
  .sidebar .foot .row { display: flex; justify-content: space-between; }

  /* ---- content ---- */
  .content { overflow-y: auto; padding: 22px 26px 40px; }
  .content-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .content-head h1 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: 0.01em; }
  .content-head .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .view { display: none; animation: fade 0.28s ease; }
  .view.on { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ---- shared bits ---- */
  .card {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 16px;
    backdrop-filter: blur(8px);
    transition: border-color 0.18s ease, box-shadow 0.18s ease, transform 0.18s ease;
  }
  .card.hov:hover { border-color: var(--line-2); box-shadow: var(--glow-cyan); transform: translateY(-1px); }
  .card h3 { margin: 0 0 12px; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .grid { display: grid; gap: 14px; }
  .g2 { grid-template-columns: 1fr 1fr; }
  .g3 { grid-template-columns: repeat(3, 1fr); }
  .g-2fr { grid-template-columns: 1.4fr 1fr; }

  .btn {
    background: linear-gradient(135deg, rgba(56,225,255,0.16), rgba(167,139,250,0.16));
    border: 1px solid var(--line-2); color: var(--text);
    padding: 8px 14px; border-radius: 10px; cursor: pointer;
    font-weight: 600; font-size: 13px; transition: all 0.15s ease;
  }
  .btn:hover { box-shadow: var(--glow-cyan); border-color: var(--cyan); }
  .btn.primary { background: linear-gradient(135deg, var(--cyan), var(--violet)); color: #04121a; border: none; }
  .btn.primary:hover { box-shadow: var(--glow-violet); filter: brightness(1.08); }
  .btn.ghost { background: transparent; border-color: var(--line); color: var(--muted); }
  .btn.ghost:hover { color: var(--text); border-color: var(--line-2); box-shadow: none; }
  .btn.danger:hover { border-color: var(--red); color: var(--red); box-shadow: 0 0 18px rgba(255,107,129,0.3); }
  .btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 8px; }

  input, select, textarea {
    background: var(--bg-2); border: 1px solid var(--line); color: var(--text);
    padding: 9px 11px; border-radius: 9px; font-family: var(--sans); font-size: 13px;
    width: 100%; outline: none; transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  textarea.mono { font-family: var(--mono); font-size: 12px; line-height: 1.5; resize: vertical; }
  input:focus, select:focus, textarea:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(56,225,255,0.12); }
  label.field { display: block; margin-bottom: 12px; }
  label.field span { display: block; font-size: 11px; color: var(--muted); margin-bottom: 6px; letter-spacing: 0.04em; }
  .field-row { display: flex; gap: 10px; }
  .field-row > * { flex: 1; }

  .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; letter-spacing: 0.03em; }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; }
  .b-green { background: rgba(67,224,160,0.12); color: var(--green); } .b-green .dot { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .b-cyan { background: rgba(56,225,255,0.12); color: var(--cyan); } .b-cyan .dot { background: var(--cyan); }
  .b-violet { background: rgba(167,139,250,0.14); color: var(--violet); } .b-violet .dot { background: var(--violet); }
  .b-amber { background: rgba(255,196,107,0.12); color: var(--amber); } .b-amber .dot { background: var(--amber); }
  .b-dim { background: rgba(120,140,200,0.10); color: var(--muted); }
  .b-red { background: rgba(255,107,129,0.12); color: var(--red); } .b-red .dot { background: var(--red); }

  .table { width: 100%; border-collapse: collapse; }
  .table th { text-align: left; font-size: 11px; color: var(--dim); letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .table td { padding: 10px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .table tr:last-child td { border-bottom: none; }
  .table tr.rowclick { cursor: pointer; }
  .table tr.rowclick:hover td { background: rgba(120,140,200,0.05); }
  .mono { font-family: var(--mono); }
  .muted { color: var(--muted); }
  .dim { color: var(--dim); }
  .code { font-family: var(--mono); font-size: 12px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 7px; padding: 2px 6px; color: var(--cyan); }

  .dot-live { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); animation: pulse 1.8s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .dot-off { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); }

  /* terminal feed */
  .term {
    background: #04060c; border: 1px solid var(--line); border-radius: 12px;
    font-family: var(--mono); font-size: 12.5px; line-height: 1.7;
    height: 460px; overflow-y: auto; padding: 14px 16px;
  }
  .term .line { white-space: pre-wrap; word-break: break-word; }
  .term .t-time { color: var(--dim); }
  .term .t-fire { color: var(--cyan); }
  .term .t-run { color: var(--green); }
  .term .t-log { color: var(--violet); }
  .term .t-notify { color: var(--amber); }
  .term .t-err { color: var(--red); }
  .term .t-doc { color: var(--text); }
  .term .new { animation: flash 1s ease; }
  @keyframes flash { from { background: rgba(56,225,255,0.18); } to { background: transparent; } }

  .empty { text-align: center; color: var(--dim); padding: 30px; font-size: 13px; }
  .empty .big { font-size: 26px; opacity: 0.5; margin-bottom: 8px; }

  .toast-wrap { position: fixed; bottom: 20px; right: 22px; display: flex; flex-direction: column; gap: 8px; z-index: 50; }
  .toast { background: var(--panel-2); border: 1px solid var(--line-2); border-left: 3px solid var(--cyan); border-radius: 10px; padding: 10px 14px; font-size: 13px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); animation: slidein 0.25s ease; }
  .toast.err { border-left-color: var(--red); }
  @keyframes slidein { from { transform: translateX(20px); opacity: 0; } to { transform: none; opacity: 1; } }

  .stat { text-align: center; padding: 18px 10px; }
  .stat .num { font-size: 30px; font-weight: 800; background: linear-gradient(135deg, var(--cyan), var(--violet)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .stat .lbl { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; margin-top: 4px; }
  .kv { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .kv:last-child { border-bottom: none; }
  .kv .k { color: var(--muted); }
  .kv .v { font-family: var(--mono); font-size: 12px; }
  .divider { height: 1px; background: var(--line); margin: 16px 0; }
  .pill-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .switch input { display: none; }
  .switch .track { width: 38px; height: 20px; border-radius: 20px; background: var(--bg-2); border: 1px solid var(--line); position: relative; transition: all 0.2s ease; }
  .switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--dim); transition: all 0.2s ease; }
  .switch input:checked + .track { background: rgba(56,225,255,0.2); border-color: var(--cyan); }
  .switch input:checked + .track::after { left: 20px; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
  .doc-name { font-family: var(--mono); color: var(--cyan); }
  .link { color: var(--cyan); cursor: pointer; text-decoration: none; }

  /* ---- update banner ---- */
  .updbar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 11px 16px; margin-bottom: 16px; border-radius: 12px;
    border: 1px solid rgba(56,225,255,0.35);
    background: linear-gradient(90deg, rgba(56,225,255,0.10), rgba(167,139,250,0.07));
    font-size: 13px;
  }
  .updbar b { color: var(--text); }
  .updbar .sep { flex: 1; }
  .updbar .note { color: var(--muted); font-size: 12px; }

  /* ---- plugins ---- */
  .plug-card { display: grid; grid-template-columns: 44px 1fr auto; gap: 14px; align-items: start; }
  .plug-ico {
    width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
    font-size: 19px; font-weight: 800; color: #04121a;
    background: linear-gradient(135deg, var(--cyan), var(--violet));
    box-shadow: var(--glow-cyan);
  }
  .plug-ico.untrusted { background: linear-gradient(135deg, var(--amber), var(--red)); box-shadow: none; }
  .plug-title { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
  .plug-by { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .plug-desc { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .plug-actions { display: flex; flex-direction: column; gap: 7px; align-items: stretch; }
  .caps { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  .caps li { font-size: 12.5px; color: var(--text); margin: 4px 0; list-style: none; display: flex; gap: 8px; }
  .caps li::before { content: "▸"; color: var(--violet); }
  .caps ul { margin: 0; padding: 0; }
  .keyline { font-family: var(--mono); font-size: 11px; color: var(--dim); word-break: break-all; }

  .scrim {
    position: fixed; inset: 0; background: rgba(4,6,12,0.72); backdrop-filter: blur(4px);
    display: grid; place-items: center; z-index: 60; animation: fadein 0.16s ease;
  }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .sheet {
    width: min(560px, calc(100vw - 40px)); max-height: 86vh; overflow-y: auto;
    background: linear-gradient(180deg, var(--bg-2), var(--bg));
    border: 1px solid var(--line-2); border-radius: 16px; padding: 22px;
    box-shadow: 0 24px 70px rgba(0,0,0,0.6), var(--glow-violet);
  }
  .sheet h2 { margin: 0 0 4px; font-size: 18px; letter-spacing: -0.01em; }
  .sheet .lead { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
  .warn {
    border: 1px solid rgba(255,196,107,0.35); background: rgba(255,196,107,0.07);
    border-radius: 11px; padding: 12px 14px; font-size: 13px; color: var(--amber); margin: 14px 0;
  }
  .warn.red { border-color: rgba(255,107,129,0.4); background: rgba(255,107,129,0.07); color: var(--red); }
  .sheet-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }

  /* ---- plugin host frame ---- */
  .frame-wrap { display: flex; flex-direction: column; height: calc(100vh - 116px); }
  .frame-chrome {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    background: var(--panel); border: 1px solid var(--line); border-bottom: none;
    border-radius: 12px 12px 0 0; font-size: 12px; color: var(--muted);
  }
  .frame-chrome .sep { flex: 1; }
  .frame-wrap iframe {
    flex: 1; width: 100%; border: 1px solid var(--line); border-radius: 0 0 12px 12px;
    background: #fff; display: block;
  }
  .link:hover { text-decoration: underline; }
  /* group-space sub-tab bar */
  .subtabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 14px 0 4px; }
  .subtab { background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--muted); padding: 8px 14px; font-size: 13px; cursor: pointer; }
  .subtab:hover { color: var(--fg); }
  .subtab.active { color: var(--cyan); border-bottom-color: var(--cyan); }
  /* rich editor widgets */
  .ed-list { display: flex; flex-direction: column; gap: 6px; margin: 6px 0; }
  .ed-list .row { display: flex; gap: 6px; }
  .ed-list .row input { flex: 1; }
  .ed-list .rm { border: 1px solid var(--line); background: var(--bg-2); color: var(--muted); border-radius: 6px; width: 30px; cursor: pointer; }
  .ed-list .rm:hover { color: #ff8a8a; border-color: #ff8a8a; }
  .ed-add { border: 1px dashed var(--line); background: transparent; color: var(--muted); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 12px; }
  .ed-add:hover { color: var(--cyan); border-color: var(--cyan); }
  /* drive tree */
  .drive-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
  .drive-item:hover { border-color: var(--line-2); background: var(--bg-2); }
  .drive-item .ic { font-size: 15px; }
  .crumb { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; margin: 8px 0 14px; }
  .crumb .c { color: var(--muted); cursor: pointer; }
  .crumb .c:hover { color: var(--cyan); }
  .crumb .c.here { color: var(--fg); cursor: default; }
  .crumb .sep { color: var(--dim); }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">R</div>
      <div class="name">Reactor<small>local console</small></div>
    </div>
    <div class="nav-item active" data-tab="overview"><span class="ico">◈</span> Home</div>
    <div class="nav-item" data-tab="groups"><span class="ico">⬡</span> Groups</div>
    <div class="nav-item" data-tab="plugins"><span class="ico">▣</span> Plugins</div>
    <div class="nav-item" data-tab="settings"><span class="ico">⚙</span> Settings</div>
    <div class="nav-item" data-tab="profile"><span class="ico">☺</span> Profile</div>
    <div id="nav-plugins"></div>
    <div class="foot">
      <div class="row"><span>peers</span><span class="mono" id="side-peers">–</span></div>
      <div class="row"><span>docs</span><span class="mono" id="side-docs">–</span></div>
    </div>
  </aside>
  <main class="content" id="content"></main>
</div>
<div class="toast-wrap" id="toasts"></div>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtTs = (t) => (t ? new Date(t).toLocaleTimeString() : "—");

async function api(path, method = "GET", body) {
  const opt = { method, headers: { "Content-Type": "application/json" } };
  if (body !== undefined) opt.body = JSON.stringify(body);
  const r = await fetch(path, opt);
  let data = null;
  const text = await r.text();
  try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!r.ok) {
    const msg = typeof data === "string" ? data : (data && data.error) ? data.error : ("HTTP " + r.status);
    const e = new Error(msg); e.status = r.status; e.data = data; throw e;
  }
  return data;
}
const get = (p) => api(p, "GET");
const post = (p, b) => api(p, "POST", b ?? {});
const put = (p, b) => api(p, "PUT", b ?? {});
const del = (p) => api(p, "DELETE");

function toast(msg, isErr = false) {
  const t = document.createElement("div");
  t.className = "toast" + (isErr ? " err" : "");
  t.textContent = msg;
  $("#toasts").appendChild(t);
  setTimeout(() => { t.style.transition = "opacity 0.3s"; t.style.opacity = "0"; setTimeout(() => t.remove(), 300); }, 3200);
}

const state = { tab: "overview", fireCursor: {}, lastFire: {} };
const TITLES = {
  overview: ["Home", "peers, live activity, and your subscriptions"],
  groups: ["Groups", "shared spaces — channels and a folder drive, signed and synced over the mesh"],
  plugins: ["Plugins", "applications published to the mesh — verified, sandboxed, installed by your decision"],
  settings: ["Settings", "drive, identity, and LLM configuration"],
  profile: ["Profile", "this node's identity on the mesh"],
  // kept for deep-links / back-compat; no longer sidebar items:
  documents: ["Documents", "create, inspect, and organize documents"],
  types: ["Types", "draft, register, and use document model types"],
  folders: ["Folders", "membership containers that group documents"],
};

function switchTab(tab) {
  state.tab = tab;
  if (location.hash !== "#" + tab) history.replaceState(null, "", "#" + tab);
  markActiveNav();
  render();
}

/* The location hash names the view, so a plugin can be linked to directly --
   "#plugin/@powerhousedao/achra" opens that editor. Everything else falls back
   to the overview rather than rendering a blank panel. */
function routeFromHash() {
  const raw = location.hash.replace(/^#/, "");
  if (raw.startsWith("plugin/")) {
    // "plugin/<name>/<view>" -- the name may itself contain an encoded slash
    // (@scope/pkg), so split the ENCODED string and decode the parts after.
    const rest = raw.slice("plugin/".length).split("/");
    return {
      tab: "plugins",
      plugin: decodeURIComponent(rest[0] || ""),
      view: rest[1] ? decodeURIComponent(rest[1]) : "",
    };
  }
  const h = decodeURIComponent(raw);
  return { tab: RENDER[h] ? h : "overview", plugin: null, view: "" };
}

async function applyRoute() {
  const r = routeFromHash();
  state.tab = r.tab;
  closeBridge();
  if (r.plugin) {
    let inst = [];
    try { inst = await get("/api/plugins"); } catch {}
    openPlugin(r.plugin, inst, r.view);
  } else {
    (RENDER[r.tab] || renderOverview)();
  }
  markActiveNav();
  renderUpdateBanner();
}

function head(tab) {
  const [t, s] = TITLES[tab];
  return `<div class="content-head"><div><h1>${t}</h1><div class="sub">${s}</div></div>
  <div style="display:flex;align-items:center;gap:8px" class="muted"><span class="dot-live" id="conn"></span><span class="mono" style="font-size:12px">live</span></div></div>`;
}

/* ============================ OVERVIEW ============================ */
async function renderOverview() {
  let peers = 0, docCount = 0;
  try {
    const ov = await get("/api/overview");
    peers = ov.peerCount ?? 0;
    docCount = ov.liveDocCount ?? 0;
  } catch {}
  $("#side-peers").textContent = peers;
  $("#side-docs").textContent = docCount;

  const [procs, ov] = await Promise.all([get("/api/processors").catch(() => []), get("/api/overview").catch(() => ({}))]);
  const fireEl = document.createElement("div");
  fireEl.innerHTML = head("overview") + `
  <div class="grid g-2fr">
    <div class="card">
      <h3>Live activity</h3>
      <div class="term" id="fire-term"></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:14px">

            <input id="sub-field" placeholder="field" title="e.g. status">
            <input id="sub-value" placeholder="value" title="the value the field becomes">
          </div>
          <div class="field-row">
            <select id="sub-reakind">
              <option value="run">run — shell command</option>
              <option value="log">log — a message</option>
              <option value="emit">emit — an event</option>
              <option value="create-doc">create — a document</option>
            </select>
            <input id="sub-reaction" placeholder="command" style="flex:1">
          </div>
          <button class="btn primary" id="sub-activate">⚡  Activate</button>
          <div class="muted" style="font-size:11px">in a run command, the doc name is <span class="code">$PH_DOC</span> and its model <span class="code">$PH_MODEL</span>.</div>
        </div>
      </div>
    </div>
  </div>`;
  $("#content").replaceChildren(fireEl);

  // New subscription: LLM-generate + manual, then activate.
  const reactKind = $("#sub-reakind");
  const reactInput = $("#sub-reaction");
  const refreshReactionLabel = () => {
    const k = reactKind.value;
    reactInput.placeholder =
      k === "run" ? "command, e.g. echo 'doc $PH_DOC changed'"
      : k === "log" ? "message, e.g. $doc was updated"
      : k === "emit" ? "event name"
      : 'JSON: {"model":"…","name":"…","fields":{…}}';
  };
  reactKind.onchange = refreshReactionLabel;
  refreshReactionLabel();

  const fillSubForm = (s) => {
    $("#sub-name").value = s.name || "";
    $("#sub-models").value = (s.models || []).join(", ");
    $("#sub-action").value = s.action_kind || "";
    $("#sub-field").value = s.field || "";
    $("#sub-value").value = s.value == null ? "" : (typeof s.value === "string" ? s.value : JSON.stringify(s.value));
    const k = s.reaction && s.reaction.kind;
    if (k) reactKind.value = k;
    refreshReactionLabel();
    if (k === "create-doc") reactInput.value = JSON.stringify({ model: s.reaction.model, name: s.reaction.name, fields: s.reaction.fields || {} });
    else if (k === "log") reactInput.value = s.reaction.message || "";
    else if (k === "emit") reactInput.value = s.reaction.event || "";
    else reactInput.value = (s.reaction && s.reaction.command) || "";
  };

  $("#sub-gen").onclick = async () => {
    const desc = $("#sub-desc").value.trim();
    if (!desc) { toast("describe the subscription first", true); return; }
    const b = $("#sub-gen"); b.disabled = true; b.textContent = "… generating";
    try {
      const r = await post("/api/llm/draft-processor", { description: desc });
      if (!r.ok) throw new Error(r.error || "draft failed");
      fillSubForm(r.spec);
      toast("drafted — review, then activate");
    } catch (e) { toast(e.message, true); }
    b.disabled = false; b.textContent = "✦  Generate with LLM";
  };

    const name = $("#sub-name").value.trim();
    if (!name) { toast("give it a name", true); return; }
    const k = reactKind.value;
    const raw = reactInput.value;
    let reaction;
    if (k === "create-doc") reaction = JSON.parse(raw || "{}");
    else if (k === "log") reaction = { kind: "log", message: raw };
    else if (k === "emit") reaction = { kind: "emit", event: raw };
    else reaction = { kind: "run", command: raw };
    const models = $("#sub-models").value.split(",").map((x) => x.trim()).filter(Boolean);
    const valRaw = $("#sub-value").value.trim();
    let value = null;
    if (valRaw) { try { value = JSON.parse(valRaw); } catch { value = valRaw; } }
    await post("/api/processors", {
      name, models,
      action_kind: $("#sub-action").value.trim() || null,
      field: $("#sub-field").value.trim() || null,
      value,
      reaction,
    });
    toast("activated: " + name);
    $("#sub-name").value = ""; $("#sub-desc").value = "";
    render();
  };

  renderProcList(procs, ov);
  pollFires(procs);
}

function renderProcList(procs, ov) {
  const el = $("#proc-list");
  if (!el) return;
  if (!procs.length) {
    el.innerHTML = `<div class="empty"><div class="big">✦</div>No subscriptions yet.<br>Create one on the right.</div>`;
    return;
  }
  const rows = procs.map((p) => {
    const filter = p.field ? ` ${p.field}=${p.value ?? ""}` : (p.action_kind ? ` ${p.action_kind}` : "");
    const models = (p.models || []).join(", ");
    const badge = p.enabled === false ? `<span class="badge b-dim"><span class="dot"></span>off</span>` : `<span class="badge b-green"><span class="dot"></span>on</span>`;
    return `<tr class="rowclick" data-pname="${esc(p.name)}">
      <td><span class="doc-name">${esc(p.name)}</span>${badge}</td>
      <td class="muted mono" style="font-size:12px">${esc(models)}${esc(filter)}</td>
      <td style="text-align:right"><span class="badge b-violet mono" style="font-size:10px">${esc(p.reaction?.kind || "")}</span></td>
    </tr>`;
  }).join("");
  el.innerHTML = `<table class="table"><thead><tr><th>name</th><th>fires when</th><th></th></tr></thead><tbody>${rows}</tbody></table>
  <div class="muted" style="font-size:11px;margin-top:8px">click a subscription to see its fire history</div>`;
  $$("#proc-list tr.rowclick").forEach((tr) => {
    tr.onclick = () => showFireDetail(tr.dataset.pname, procs);
  });
}

function showFireDetail(name, procs) {
  const p = procs.find((x) => x.name === name);
  const fire = document.createElement("div");
  fire.innerHTML = `<div class="content-head"><button class="btn ghost sm" id="back">← back</button><h1>${esc(name)}</h1></div>
  <div class="card"><h3>Reaction</h3><div class="kv"><span class="k">type</span><span class="v">${esc(p?.reaction?.kind || "—")}</span></div>
  <div class="kv"><span class="k">reaction</span><span class="v">${esc(JSON.stringify(p?.reaction || {}))}</span></div>
  <div class="kv"><span class="k">models</span><span class="v">${esc((p?.models || []).join(", "))}</span></div>
  <div class="kv"><span class="k">filter</span><span class="v">${esc(p?.field ? p.field + "=" + (p.value ?? "") : (p?.action_kind || "—"))}</span></div>
  <div class="divider"></div><h3>Fires</h3><div class="term" id="detail-term" style="height:360px"></div></div>`;
  $("#content").replaceChildren(fire);
  $("#back").onclick = () => render();
  (async () => {
    try {
      const fires = await get(`/api/processors/${encodeURIComponent(name)}/fires`);
      const term = $("#detail-term");
      term.innerHTML = fires.length
        ? fires.slice().reverse().map((f) => fireLine(f)).join("")
        : `<div class="empty"><div class="big">✦</div>No fires yet.</div>`;
    } catch (e) { $("#detail-term").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  })();
}

function fireLine(f) {
  const detail = f.detail || f.action || "fire";
  return `<div class="line"><span class="t-time">${fmtTs(f.ts)}</span> <span class="t-fire">✦</span> <span class="t-run">${esc(detail)}</span> <span class="t-doc dim">← ${esc(f.doc)}${f.action ? " · " + esc(f.action) : ""}</span></div>`;
}

async function pollFires(procs) {
  if (state.tab !== "overview") return;
  const term = $("#fire-term");
  if (!term) return;
  for (const p of procs) {
    try {
      const fires = await get(`/api/processors/${encodeURIComponent(p.name)}/fires`);
      const last = state.lastFire[p.name];
      if (fires.length && fires[fires.length - 1] !== last) {
        state.lastFire[p.name] = fires[fires.length - 1];
        const line = document.createElement("div");
        line.className = "line new";
        const latest = fires.slice().reverse()[0];
        line.innerHTML = `<span class="t-time">${fmtTs(latest.ts)}</span> <span class="t-fire">✦</span> <span class="t-run">${esc(latest.detail || latest.action || "fire")}</span> <span class="t-doc dim">← ${esc(latest.doc)} <span class="dim">[${esc(p.name)}]</span></span>`;
        term.prepend(line);
      }
    } catch {}
  }
  while (term.children.length > 200) term.lastChild.remove();
  term.scrollTop = 0;
  setTimeout(() => pollFires(procs), 1500);
}

    const q = [];
    if (m) q.push("model=" + encodeURIComponent(m));

    const box = $("#docs-list");
    box.innerHTML = docs.length
      ? `<table class="table"><thead><tr><th>name</th><th>model</th></tr></thead><tbody>${docs.map((d) => `<tr class="rowclick" data-doc="${esc(d.name)}"><td class="doc-name">${esc(d.name)}</td><td><span class="badge b-cyan">${esc(d.model)}</span></td></tr>`).join("")}</tbody></table>`
      : `<div class="empty"><div class="big">▤</div>No documents. Create one on the right.</div>`;

  $("#doc-model-filter").onchange = loadDocs;

  const fillFields = () => {
    const m = models.find((x) => x.name === $("#new-model").value);
    if (!m) return;
    const f = {};
    for (const k of Object.keys(m.fields || {})) f[k] = "";
    $("#new-fields").value = JSON.stringify(f, null, 2);
  };
  $("#new-model").onchange = fillFields;
  fillFields();
  $("#new-doc-create").onclick = async () => {
    try {
      const name = $("#new-name").value.trim();
      const model = $("#new-model").value;
      let fields; try { fields = JSON.parse($("#new-fields").value || "{}"); } catch { return toast("invalid JSON in fields", true); }
      fields.name = name;
      await post("/api/docs", { name, model, fields });
      toast("created " + name);
      loadDocs();
    } catch (e) { toast(e.message, true); }
  };

  await loadDocs();

function showDoc(name, models) {
  (async () => {
    try {
      const d = await get("/api/docs/" + encodeURIComponent(name));
      const card = $("#doc-detail-card");
      card.style.display = "";
      const fields = Object.entries(d.fields || {}).map(([k, v]) => `<div class="kv"><span class="k">${esc(k)}</span><span class="v">${esc(JSON.stringify(v))}</span></div>`).join("");
      const m = models.find((x) => x.name === d.model);
      const setFields = (m && m.reducers ? Object.keys(m.reducers) : []).filter((k) => k.startsWith("set-")).map((k) => k.slice(4));
      const fieldControl = setFields.length
        ? `<select id="act-field">${setFields.map((f) => `<option value="${esc(f)}">${esc(f)}</option>`).join("")}</select>`
        : `<input id="act-field" placeholder="a field to set">`;
      card.innerHTML = `<h3>Document</h3>
        <div class="kv"><span class="k">name</span><span class="v">${esc(d.name)}</span></div>
        <div class="kv"><span class="k">model</span><span class="v">${esc(d.model)}</span></div>
        <div class="divider"></div>${fields}
        <div class="divider"></div>
        <h3>Actions</h3>
        <div class="field"><span>${setFields.length ? "action" : "field"}</span><div class="field-row">${fieldControl}<input id="act-value" placeholder="value"></div></div>
        <button class="btn" id="act-set">apply</button>
        <div class="muted" style="font-size:11px;margin-top:8px">${setFields.length ? "this model exposes: " + setFields.map((f) => "set-" + f).join(", ") + " (fire any processor watching them)" : "open doc — any field can be set"}</div>`;
      $("#act-set").onclick = async () => {
        try {
          const f = $("#act-field").value.trim(), v = $("#act-value").value.trim();
          if (!f) return;
          const kind = setFields.includes(f) ? "set-" + f : "set";
          const payload = kind === "set" ? { field: f, value: v } : { [f]: v };
          await post("/api/docs/action", { name: d.name, model: d.model, kind, payload });
          toast("set " + f + " → " + v);
          showDoc(name, models);
        } catch (e) { toast(e.message, true); }
      };
    } catch (e) { toast(e.message, true); }
  })();
}

    localStorage.setItem("reactor-prefill", JSON.stringify({ model: m.name, fields: JSON.stringify(f, null, 2) }));

          <label class="field"><span>initial members (comma-separated peer ids — optional)</span><input id="grp-members" placeholder="peer-a, peer-b"></label>
          <button class="btn primary" id="grp-create">+ Create group</button>
        </div>
        <div class="card"><h3>2 · Join a group</h3>
          <div class="muted" style="font-size:12.5px;margin-bottom:10px">Paste an invite a member shared. It connects you to their node and adds you to the group.</div>
          <label class="field"><span>invite link</span><textarea id="grp-join-invite" class="mono" rows="3" placeholder="paste the base64 invite" style="width:100%;box-sizing:border-box;font-size:11px"></textarea></label>
          <button class="btn primary" id="grp-join">Join →</button>
        </div>
      </div>
    </div>
  </div>
  <div id="group-detail" style="display:none"></div>`;
  $("#content").replaceChildren(el);

  const load = () => {
    const box = $("#groups-list");
    box.innerHTML = groups.length
      ? `<table class="table"><thead><tr><th>name</th><th>members</th><th>managers</th><th>messages</th><th>drive</th></tr></thead><tbody>${groups.map((g) => `<tr class="rowclick" data-grp="${esc(g.name)}"><td class="doc-name">${esc(g.name)}</td><td>${g.memberCount}</td><td>${g.managerCount}</td><td>${g.msgCount}</td><td>${g.driveCount}</td></tr>`).join("")}</tbody></table>`
      : `<div class="empty"><div class="big">⬡</div>No groups yet. Create one, then share its invite link.</div>`;
    $$("#groups-list tr.rowclick").forEach((tr) => (tr.onclick = () => showGroup(tr.dataset.grp)));
  };
  load();

  $("#grp-create").onclick = async () => {
    const name = $("#grp-name").value.trim();
    if (!name) return toast("a name is required", true);
    const members = $("#grp-members").value.split(",").map((s) => s.trim()).filter(Boolean);
    try {
      await post("/api/groups", { name, members, managers: [] });
      toast("created group " + name + " — you are a member and manager");
      const fresh = await get("/api/groups");
      groups.length = 0; fresh.forEach((g) => groups.push(g));
      load();
      showGroup(name);
    } catch (e) { toast(e.message, true); }
  };

  $("#grp-join").onclick = async () => {
    const invite = $("#grp-join-invite").value.trim();
    if (!invite) return toast("paste an invite link first", true);
    try {
      await post("/api/join", { invite });
      toast("joined — syncing with the inviter; you're being added to the group(s) in the invite");
      const fresh = await get("/api/groups");
      groups.length = 0; fresh.forEach((g) => groups.push(g));
      load();
    } catch (e) { toast(e.message, true); }
  };
}

// The group space: a sub-tabbed view — Overview | Channels | Drive.
async function showGroup(name) {
  const g = await get(`/api/groups/${encodeURIComponent(name)}`).catch(() => null);
  if (!g) return;
  $("#groups-main").style.display = "none";
  const card = $("#group-detail");
  card.style.display = "";
  const ui = groupUi[name] || (groupUi[name] = { subtab: "overview", channel: "general", folder: null });
  card.innerHTML = `
    <button class="btn ghost sm" id="grp-back" style="margin-bottom:12px">← all groups</button>
    <div class="card" style="border-color:var(--line-2)">
      <div style="display:flex;align-items:baseline;gap:10px;margin-bottom:4px">
        <h3>${esc(name)}</h3>
        <span class="muted" style="font-size:12.5px">${(g.members || []).length} member(s) · ${(g.managers || []).length} manager(s)</span>
      </div>
      <div class="subtabs" id="grp-subtabs">
        <button class="subtab" data-sub="overview">Overview</button>
        <button class="subtab" data-sub="channels">Channels</button>
        <button class="subtab" data-sub="drive">Drive</button>
      </div>
      <div id="grp-subbody"></div>
    </div>`;
  $("#grp-back").onclick = () => { card.style.display = "none"; $("#groups-main").style.display = ""; };
  $$("#grp-subtabs .subtab").forEach((b) => (b.onclick = () => { ui.subtab = b.dataset.sub; renderGroupSub(name, ui); }));
  await renderGroupSub(name, ui);
}

async function renderGroupSub(name, ui) {
  $$("#grp-subtabs .subtab").forEach((b) => b.classList.toggle("active", b.dataset.sub === ui.subtab));
  if (ui.subtab === "overview") {
    const g = await get(`/api/groups/${encodeURIComponent(name)}`).catch(() => ({}));
    renderGroupOverview(name, g, ui);
  } else if (ui.subtab === "channels") renderGroupChannels(name, ui);
  else renderGroupDrive(name, ui);
}

    <h4>Managers <span class="muted" style="font-weight:400;font-size:12px">edit membership, remove drive items</span></h4>

// Channels sub-tab: list, create (public/private), composer, filtered messages.
async function renderGroupChannels(name, ui) {
  const body = $("#grp-subbody");
  const g = await get(`/api/groups/${encodeURIComponent(name)}`).catch(() => ({}));
  const ov = await get("/api/overview").catch(() => ({}));
  const me = ov.peerId || "";
  const channels = g.channels || [];
  const isPriv = (c) => c && c.visibility === "private";
  const canRead = (c) => !isPriv(c) || (c.members || []).includes(me);
  let sel = channels.find((c) => c.name === ui.channel) ? ui.channel : (channels[0] ? channels[0].name : "general");
  ui.channel = sel;
  const selChan = channels.find((c) => c.name === sel) || { name: sel, visibility: "public", members: [] };
  const readable = canRead(selChan);
  // messages in the selected channel (filtered from the parallel arrays)
  const from = g.msgFrom || [], text = g.msgText || [], ts = g.msgTs || [], chan = g.msgChannel || [];
  const msgHtml = text
    .map((t, i) => (chan[i] === sel ? `<div class="msg" style="margin-bottom:10px">
      <div style="margin-bottom:3px"><span class="badge b-cyan mono">${esc(shortPeer(from[i] || "?"))}</span><span class="dim mono" style="font-size:11px;margin-left:8px">${esc(fmtTs(ts[i]))}</span></div>
      <div style="font-size:13.5px;white-space:pre-wrap">${esc(t)}</div></div>` : ""))
    .join("");
  body.innerHTML = `
    <div style="display:flex;gap:12px;align-items:flex-start">
      <div style="flex:0 0 230px">
        <h4 style="margin:8px 0 8px">Channels</h4>
        <div style="display:flex;flex-direction:column;gap:4px">
          ${channels.map((c) => `<div class="drive-item" data-ch="${esc(c.name)}" style="${c.name === sel ? "border-color:var(--cyan)" : ""}">
            <span class="ic">${isPriv(c) ? "🔒" : "💬"}</span>
            <span style="flex:1">#${esc(c.name)}</span>
            <span class="badge ${isPriv(c) ? "b-violet" : "b-green"}" style="font-size:10px">${esc(c.visibility || "public")}</span>
          </div>`).join("") || '<div class="muted" style="font-size:12px">no channels</div>'}
        </div>
        <div class="divider"></div>
        <h4 style="margin:8px 0 8px">New channel</h4>
        <label class="field"><span>name</span><input id="ch-name" placeholder="design"></label>
        <div class="field-row" style="margin:8px 0">
          <label class="switch"><input type="radio" name="ch-vis" value="public" checked><span class="track"></span> public</label>
          <label class="switch"><input type="radio" name="ch-vis" value="private"><span class="track"></span> private</label>
        </div>
        <div id="ch-members-wrap" style="display:none"><label class="field"><span>members (comma-separated peer ids — who may read/post)</span><input id="ch-members" placeholder="${esc(me || "peer-a, peer-b")}"></label></div>
        <button class="btn sm" id="ch-add">+ Create channel</button>
      </div>
      <div style="flex:1">
        <div class="field-row" style="margin-bottom:10px;gap:12px">
          <label class="field" style="flex:0 0 200px"><span>posting to</span><select id="ch-sel">${channels.map((c) => `<option value="${esc(c.name)}" ${c.name === sel ? "selected" : ""} ${isPriv(c) && !canRead(c) ? "disabled" : ""}>${isPriv(c) ? "🔒 " : ""}#${esc(c.name)}</option>`).join("")}</select></label>
          <span class="muted" style="font-size:11.5px;align-self:flex-end">${isPriv(selChan) ? "private — only its members can read/post" : "public — any member can read/post"}</span>
        </div>
        ${readable ? `
          <div style="max-height:280px;overflow-y:auto;border:1px solid var(--line-2);border-radius:10px;padding:12px;margin-bottom:10px">
            ${msgHtml || `<div class="muted" style="font-size:12.5px">No messages in #${esc(sel)} yet — say something below.</div>`}
          </div>
          <div class="field-row" style="gap:8px">
            <input id="grp-msg" placeholder="post to #${esc(sel)}…" style="flex:1">
            <button class="btn primary sm" id="grp-msg-send">post</button>
          </div>` : `
          <div style="border:1px solid var(--line-2);border-radius:10px;padding:16px;font-size:13px;color:var(--muted)">🔒 You are not a member of this private channel, so you can't read or post here. Ask a member to add your peer id.</div>`}
      </div>
    </div>`;
  // toggle the members field when private is chosen
  const toggleMembers = () => { $("#ch-members-wrap").style.display = ($("input[name=ch-vis]:checked").value === "private") ? "" : "none"; };
  $$("#ch-vis").forEach((r) => (r.onchange = toggleMembers));
  $$("#grp-subbody [data-ch]").forEach((row) => (row.onclick = () => { ui.channel = row.dataset.ch; renderGroupChannels(name, ui); }));
  $("#ch-sel").onchange = () => { ui.channel = $("#ch-sel").value; renderGroupChannels(name, ui); };
  $("#ch-add").onclick = async () => {
    const n = $("#ch-name").value.trim();
    if (!n) return toast("give the channel a name", true);
    const vis = $("input[name=ch-vis]:checked").value;
    const members = vis === "private" ? $("#ch-members").value.split(",").map((s) => s.trim()).filter(Boolean) : [];

      await post(`/api/groups/${encodeURIComponent(name)}/channels`, { name: n, visibility: vis, members });
      toast("created #" + n + " (" + vis + ")");
      ui.channel = n;
      renderGroupChannels(name, ui);
    } catch (e) { toast(e.message, true); }
  };
  const sendMsg = async () => {
    const t = $("#grp-msg").value.trim();
    if (!t) return;
    try {
      await post(`/api/groups/${encodeURIComponent(name)}/action`, { kind: "post", payload: { text: t, channel: sel } });
      renderGroupChannels(name, ui);
    } catch (e) { toast(e.message, true); }
  };
  if (readable) {
    $("#grp-msg-send").onclick = sendMsg;
    $("#grp-msg").addEventListener("keydown", (e) => { if (e.key === "Enter") sendMsg(); });
  }
}

// Drive sub-tab: folder tree + breadcrumb + New (folder / typed doc).
async function renderGroupDrive(name, ui) {
  const body = $("#grp-subbody");
  const items = await get(`/api/groups/${encodeURIComponent(name)}/drive`).catch(() => []);
  const models = await get("/api/models").catch(() => []);
  const byName = {}; items.forEach((i) => (byName[i.name] = i));
  const cur = ui.folder || null;
  // breadcrumb: walk parents from the current folder up to the root
  const path = [];
  let c = cur;
  while (c != null) { path.unshift(c); const it = byName[c]; c = it && it.parent != null ? it.parent : null; }
  const kids = items.filter((i) => (i.parent == null ? null : i.parent) === cur);
  const crumb = ['<span class="c" data-crumb="">root</span>'].concat(
    path.map((p, idx) => `<span class="sep">›</span><span class="c ${idx === path.length - 1 ? "here" : ""}" data-crumb="${esc(p)}">${esc(p)}</span>`)
  ).join("");
  const itemRow = (i) => i.kind === "folder"
    ? `<div class="drive-item" data-open="${esc(i.name)}"><span class="ic">📁</span><span style="flex:1">${esc(i.name)}</span><button class="btn ghost sm" data-del="${esc(i.name)}">delete</button></div>`
    : `<div class="drive-item" data-open="${esc(i.name)}" data-doc="${esc(i.name)}"><span class="ic">📄</span><span style="flex:1">${esc(i.title || i.name)}</span><span class="badge b-cyan" style="font-size:10px">${esc(i.model || "doc")}</span><button class="btn ghost sm" data-del="${esc(i.name)}">delete</button></div>`;
  body.innerHTML = `
    <div class="crumb">${crumb}</div>
    <div style="display:flex;gap:12px;align-items:flex-start">
      <div style="flex:1">
        <div style="display:flex;flex-direction:column;gap:8px">
          ${kids.map(itemRow).join("") || '<div class="muted" style="font-size:12.5px">This folder is empty. Use <b>New</b> to add a folder or a document.</div>'}
        </div>
      </div>
      <div style="flex:0 0 250px">
        <div class="card" style="margin:0">
          <h4 style="margin-bottom:10px">New <span class="muted" style="font-weight:400;font-size:11px">in ${cur ? "#" + esc(cur) : "root"}</span></h4>
          <details open>
            <summary class="muted" style="font-size:12.5px;cursor:pointer">Folder</summary>
            <label class="field" style="margin-top:8px"><span>name</span><input id="nf-name" placeholder="Q3 plans"></label>
            <button class="btn sm" id="nf-add">+ New folder</button>
          </details>
          <div class="divider"></div>
          <details open>
            <summary class="muted" style="font-size:12.5px;cursor:pointer">Document</summary>
            <label class="field" style="margin-top:8px"><span>type</span><select id="nd-model">${models.filter((m) => !["group", "folder"].includes(m.name)).map((m) => `<option value="${esc(m.name)}">${esc(m.name)}@${esc(m.version)}</option>`).join("")}</select></label>
            <label class="field"><span>name (optional)</span><input id="nd-name" placeholder="auto if blank"></label>
            <button class="btn primary sm" id="nd-add">+ New document</button>
          </details>
        </div>
      </div>
    </div>`;
  $$("#grp-subbody [data-crumb]").forEach((cr) => (cr.onclick = () => {
    if (cr.classList.contains("here")) return;
    ui.folder = cr.dataset.crumb || null;
    renderGroupDrive(name, ui);
  }));
  $$("#grp-subbody [data-open]").forEach((row) => (row.onclick = (e) => {
    if (e.target.closest("[data-del]")) return;
    if (row.dataset.doc) openEditor(row.dataset.doc, name, models, ui);
    else { ui.folder = row.dataset.open; renderGroupDrive(name, ui); }
  }));
  $$("#grp-subbody [data-del]").forEach((b) => (b.onclick = async (e) => {
    e.stopPropagation();
    try {
      await del(`/api/groups/${encodeURIComponent(name)}/drive/${encodeURIComponent(b.dataset.del)}`);
      toast("deleted " + b.dataset.del);
      renderGroupDrive(name, ui);
    } catch (err) { toast(err.message, true); }
  }));
  $("#nf-add").onclick = async () => {
    const n = $("#nf-name").value.trim();
    if (!n) return toast("name the folder", true);
    try {
      await post(`/api/groups/${encodeURIComponent(name)}/drive/folder`, { name: n, parent: cur });
      toast("added folder " + n);
      renderGroupDrive(name, ui);
    } catch (e) { toast(e.message, true); }
  };
  $("#nd-add").onclick = async () => {
    const model = $("#nd-model").value;
    const nm = $("#nd-name").value.trim();
    try {
      await post(`/api/groups/${encodeURIComponent(name)}/drive/doc`, { name: nm || undefined, model, parent: cur });
      toast("created " + model + " document");
      renderGroupDrive(name, ui);
    } catch (e) { toast(e.message, true); }
  };
}

// Rich editor: field-type-aware widgets; each field saves via the model's own
// reducer (set-<field>, or the open-model `set` fallback).
async function openEditor(docName, groupName, models, ui) {
  const body = $("#grp-subbody");
  let d;
  try { d = await get("/api/docs/" + encodeURIComponent(docName)); }
  catch (e) { return toast(e.message, true); }
  const model = models.find((m) => m.name === d.model);
  const fdef = (model && model.fields) || {};
  const enums = (model && model.enums) || {};
  const reducers = (model && model.reducers) || {};
  const cur = d.fields || {};
  const canEdit = (k) => !!reducers["set-" + k] || !!reducers["set"];

  const widget = (k, type) => {
    const val = cur[k];
    if (!canEdit(k)) {
      const shown = Array.isArray(val) ? val.join(", ") : (val == null ? "" : (typeof val === "object" ? JSON.stringify(val) : val));
      return `<div class="kv"><span class="k">${esc(k)}</span><span class="v">${esc(shown)} <span class="muted" style="font-size:10px">(read-only)</span></span></div>`;
    }
    if (type === "string" && Array.isArray(enums[k])) {
      const opts = enums[k].map((o) => `<option ${o === val ? "selected" : ""}>${esc(o)}</option>`).join("");
      const extra = (val != null && !enums[k].includes(val)) ? `<option selected>${esc(val)}</option>` : "";
      return `<label class="field"><span>${esc(k)} <span class="muted mono" style="font-size:10px">(select)</span></span><select id="ed-${k}">${extra}${opts}</select></label>`;
    }
    if (type === "string") return `<label class="field"><span>${esc(k)}</span><input id="ed-${k}" value="${esc(val == null ? "" : val)}"></label>`;
    if (type === "number") return `<label class="field"><span>${esc(k)}</span><input id="ed-${k}" type="number" value="${esc(val == null ? "" : val)}"></label>`;
    if (type === "boolean") return `<label class="switch" style="margin:8px 0"><input id="ed-${k}" type="checkbox" ${val ? "checked" : ""}><span class="track"></span> ${esc(k)}</label>`;
    if (type === "string[]" || type === "number[]" || type === "boolean[]" || type === "array") {
      const items = Array.isArray(val) ? val : (val == null ? [] : [val]);
      const rows = items.map((x) => `<div class="row"><input value="${esc(typeof x === "string" ? x : JSON.stringify(x))}"><button class="rm">✕</button></div>`).join("");
      return `<div style="margin:8px 0"><span class="muted" style="font-size:12px">${esc(k)} <span class="mono" style="font-size:10px">(${esc(type)})</span></span>
        <div class="ed-list" id="ed-${k}-list">${rows}</div>
        <button class="ed-add" id="ed-${k}-add">+ add item</button></div>`;
    }
    // object / unknown → editable JSON
    return `<label class="field"><span>${esc(k)} <span class="muted mono" style="font-size:10px">(JSON)</span></span><textarea id="ed-${k}" class="mono" rows="3">${esc(JSON.stringify(val == null ? null : val))}</textarea></label>`;
  };

  const setters = Object.keys(reducers).filter((r) => r.startsWith("set-"));
  body.innerHTML = `
    <button class="btn ghost sm" id="ed-back" style="margin-bottom:12px">← back to drive</button>
    <div class="card" style="border-color:var(--line-2)">
      <h3>${esc(docName)} <span class="badge b-violet" style="font-size:11px;vertical-align:middle">${esc(d.model)}</span></h3>
      <div class="muted" style="font-size:12px;margin-bottom:14px">Each field saves with the model's own reducer${setters.length ? " (" + setters.join(", ") + ")" : " (set)"}. Changes are signed and sync over the mesh.</div>
      <div style="display:flex;flex-direction:column;gap:6px">${Object.keys(fdef).map((k) => widget(k, fdef[k])).join("") || '<div class="muted">No fields.</div>'}</div>
      <div style="margin-top:16px;display:flex;gap:10px">
        <button class="btn primary" id="ed-save">Save</button>
        <button class="btn ghost" id="ed-cancel">cancel</button>
      </div>
    </div>`;
  // wire list add/remove
  Object.keys(fdef).forEach((k) => {
    const list = $(`#ed-${k}-list`);
    if (!list) return;
    const addBtn = $(`#ed-${k}-add`);
    if (addBtn) addBtn.onclick = () => {
      const row = document.createElement("div"); row.className = "row";
      row.innerHTML = `<input value=""><button class="rm">✕</button>`;
      list.appendChild(row);
    };
    list.querySelectorAll(".rm").forEach((b) => (b.onclick = () => b.closest(".row").remove()));
  });
  const collect = (k, type) => {
    if (type === "boolean") return $(`#ed-${k}`).checked;
    if (type === "number") { const v = $(`#ed-${k}`).value; return v === "" ? 0 : Number(v); }
    if (type === "string[]" || type === "number[]" || type === "boolean[]" || type === "array") {
      const inputs = $(`#ed-${k}-list`).querySelectorAll(".row input");
      return Array.from(inputs).map((i) => i.value);
    }
    if (type === "object") { const raw = $(`#ed-${k}`).value.trim(); try { return JSON.parse(raw || "null"); } catch { return cur[k]; } }
    return $(`#ed-${k}`).value; // string / select
  };
  const save = async () => {
    let changed = 0;
    for (const k of Object.keys(fdef)) {
      if (!canEdit(k)) continue;
      const nv = collect(k, fdef[k]);
      if (JSON.stringify(nv) === JSON.stringify(cur[k])) continue;
      const setter = "set-" + k;
      const kind = reducers[setter] ? setter : "set";
      const payload = kind === "set" ? { field: k, value: nv } : { [k]: nv };
      changed++;
      try {
        await post("/api/docs/action", { name: d.name, model: d.model, kind, payload });
      } catch (e) { return toast(`${k}: ${e.message}`, true); }
    }
    toast(changed ? "saved " + changed + " field(s)" : "no changes");
    if (changed) openEditor(docName, groupName, models, ui);
  };
  $("#ed-save").onclick = save;
  const back = () => { ui.subtab = "drive"; renderGroupDrive(groupName, ui); };
  $("#ed-back").onclick = back;
  $("#ed-cancel").onclick = back;
}

/* ============================ PLUGINS ============================ */
/*
 * Editors run on a different origin -- the asset server, one port up -- so the
 * browser's same-origin policy, not our own discipline, is what keeps a plugin
 * away from this console's API. Everything a plugin wants has to cross a
 * postMessage seam that this file mediates.
 *
 * The checks below are a convenience for the plugin, not the security boundary:
 * the daemon re-checks every call against the package's declared capabilities
 * before it touches anything, so bypassing this code gains nothing.
 */
const ASSET_ORIGIN = location.protocol + "//" + location.hostname + ":" + (Number(location.port || 80) + 1);

const initials = (n) => (String(n).replace(/^@[^/]*\//, "").replace(/[^a-z0-9]/gi, "").slice(0, 2) || "??").toUpperCase();
const shortKey = (k) => (k ? k.slice(0, 8) + "…" + k.slice(-8) : "—");

function sheet(html) {
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  scrim.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(scrim);
  const close = () => scrim.remove();
  scrim.onclick = (e) => { if (e.target === scrim) close(); };
  const esckey = (e) => { if (e.key === "Escape") { close(); document.removeEventListener("keydown", esckey); } };
  document.addEventListener("keydown", esckey);
  return { el: scrim, close };
}

/* The install prompt. The operator is being asked one question -- do you accept
 * this publisher -- so the prompt leads with the key and says, in words, what
 * saying yes allows. A JSON blob is not a decision anyone can make. */
function installPrompt(pkg, onConfirm) {
  const capLines = (pkg.capabilities || []).map((c) => `<li>${esc(c)}</li>`).join("");
  const firstTime = !pkg.trusted;
  const { el, close } = sheet(`
    <h2>Install ${esc(pkg.name)}</h2>
    <div class="lead">version ${esc(pkg.version)} · ${esc(pkg.models)} document model${pkg.models === 1 ? "" : "s"}${pkg.hasEditor ? " · includes an editor" : ""}</div>

    <div class="kv"><span class="k">publisher</span><span class="v">${esc(pkg.publisher || "unnamed")}</span></div>
    <div class="kv"><span class="k">signing key</span><span class="v keyline">${esc(pkg.publisherKey)}</span></div>
    <div class="kv"><span class="k">signature</span><span class="v">${pkg.signatureOk ? '<span class="badge b-green"><span class="dot"></span>valid</span>' : '<span class="badge b-red"><span class="dot"></span>INVALID</span>'}</span></div>

    ${firstTime ? `<div class="warn">
      You have not installed from this key before. The publisher name above is
      just a label — anyone can type “${esc(pkg.publisher || "Powerhouse")}”. The key is the identity,
      and approving it here pins it for future installs.
    </div>` : `<div class="kv"><span class="k">trust</span><span class="v"><span class="badge b-green"><span class="dot"></span>key already approved</span></span></div>`}

    <div class="caps">
      <div class="muted" style="font-size:11px;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:6px">This plugin will be able to</div>
      <ul>${capLines}${pkg.sidebar ? `<li>${esc(pkg.sidebar)}</li>` : ""}</ul>
      <div class="dim" style="font-size:12px;margin-top:10px">
        It cannot reach anything else. Your drives, identity, configuration and
        the daemon itself are on a different origin it has no access to, and every
        write it makes still passes the document model's own rules.
      </div>
    </div>

    <div class="sheet-actions">
      <button class="btn ghost" id="px-cancel">Cancel</button>
      <button class="btn primary" id="px-ok"${pkg.signatureOk ? "" : " disabled"}>${firstTime ? "Trust publisher & install" : "Install"}</button>
    </div>
  `);
  $("#px-cancel", el).onclick = close;
  $("#px-ok", el).onclick = async () => {
    $("#px-ok", el).disabled = true;
    try { await onConfirm(); close(); }
    catch (e) { toast(e.message, true); $("#px-ok", el).disabled = false; }
  };
}

async function installPackage(pkg) {
  const res = await post(`/api/packages/${encodeURIComponent(pkg.doc)}/install`, { trust_publisher: true });
  if (res && res.status === "fetching") {
    toast(`fetching editor — ${res.missing} of ${res.chunks ?? "?"} chunks still to arrive`);
  } else {
    toast(`installed ${pkg.name}`);
  }
  renderPlugins();
  renderPluginNav();
}

async function renderPlugins() {
  // `.view` is display:none in this stylesheet and every other renderer mounts
  // with replaceChildren, so follow that rather than leave the panel hidden.
  const wrap = document.createElement("div");
  wrap.innerHTML = head("plugins") + `<div id="plug-body"><div class="empty">loading…</div></div>`;
  $("#content").replaceChildren(wrap);

  let avail = [], inst = [], pubs = [];
  try { [avail, inst, pubs] = await Promise.all([get("/api/packages"), get("/api/plugins"), get("/api/publishers")]); }
  catch (e) { $("#plug-body").innerHTML = `<div class="card"><div class="empty">${esc(e.message)}</div></div>`; return; }

  // An offer is anything on the mesh this node is not already running. A
  // DIFFERENT version of something installed is still an offer -- hiding it by
  // name meant a published upgrade was invisible, which is the one moment the
  // list most needs to speak up.
  const installedVersion = new Map(inst.map((p) => [p.name, p.version]));
  const offers = avail.filter((p) => p.name && installedVersion.get(p.name) !== p.version);

  const installedCards = inst.map((p) => `
    <div class="card plug-card" data-open="${esc(p.name)}">
      <div class="plug-ico">${esc(initials(p.name))}</div>
      <div>
        <div class="plug-title">${esc(p.name)}</div>
        <div class="plug-by">${esc(p.publisher || "unnamed publisher")} · v${esc(p.version)}</div>
        ${p.description ? `<div class="plug-desc">${esc(p.description)}</div>` : ""}
        <div class="caps"><ul>${(p.capabilities || []).map((c) => `<li>${esc(c)}</li>`).join("")}</ul></div>
      </div>
      <div class="plug-actions">
        ${p.hasEditor ? `<button class="btn primary sm" data-open-btn="${esc(p.name)}">Open</button>` : `<span class="badge b-dim">no editor</span>`}
        <button class="btn ghost sm" data-remove="${esc(p.name)}">Remove</button>
      </div>
    </div>`).join("");

  const offerCards = offers.map((p) => {
    const bad = !p.signatureOk;
    const withdrawn = p.status === "withdrawn";
    const have = installedVersion.get(p.name);
    return `
    <div class="card plug-card">
      <div class="plug-ico${p.trusted && !bad ? "" : " untrusted"}">${esc(initials(p.name))}</div>
      <div>
        <div class="plug-title">${esc(p.name)} <span class="muted" style="font-weight:400">v${esc(p.version)}</span></div>
        <div class="plug-by">${esc(p.publisher || "unnamed publisher")}${p.group ? ` \u00b7 via the <b style="color:var(--text)">${esc(p.group)}</b> group` : ""}
          ${have ? `<span class="badge b-cyan" style="margin-left:6px"><span class="dot"></span>update from v${esc(have)}</span>` : ""}
          ${p.trusted ? '<span class="badge b-green" style="margin-left:6px"><span class="dot"></span>trusted key</span>'
                      : '<span class="badge b-amber" style="margin-left:6px"><span class="dot"></span>new publisher</span>'}
          ${bad ? '<span class="badge b-red" style="margin-left:6px"><span class="dot"></span>bad signature</span>' : ""}
          ${withdrawn ? '<span class="badge b-red" style="margin-left:6px"><span class="dot"></span>withdrawn</span>' : ""}
        </div>
        ${p.description ? `<div class="plug-desc">${esc(p.description)}</div>` : ""}
        <div class="keyline" style="margin-top:8px">${esc(p.publisherKey || "")}</div>
        ${p.bundleMissing > 0 ? `<div class="plug-desc">editor: ${p.bundleMissing} of ${p.bundleChunks} chunks still arriving from peers</div>` : ""}
      </div>
      <div class="plug-actions">
        <button class="btn ${bad || withdrawn ? "ghost" : "primary"} sm" data-install="${esc(p.doc)}"${bad ? " disabled" : ""}>${have ? "Review & update" : "Review & install"}</button>
      </div>
    </div>`;
  }).join("");

  const pubRows = pubs.map((p) => `
    <div class="kv"><span class="k">${esc(p.name || "unnamed")}<div class="keyline">${esc(p.key)}</div></span>
    <span class="v"><button class="btn ghost sm" data-revoke="${esc(p.key)}">Revoke</button></span></div>`).join("");

  $("#plug-body").innerHTML = `
    <div class="grid" style="gap:18px">
      <div>
        <h3 class="muted" style="font-size:11px;letter-spacing:0.12em;text-transform:uppercase;margin:0 0 10px">Installed</h3>
        ${installedCards || `<div class="card"><div class="empty"><div class="big">▣</div>Nothing installed yet.<br>Packages published to a drive you're on show up below.</div></div>`}
      </div>
      <div>
        <h3 class="muted" style="font-size:11px;letter-spacing:0.12em;text-transform:uppercase;margin:0 0 10px">Available on the mesh</h3>
        ${offerCards || `<div class="card"><div class="empty">No packages offered on the drives you're connected to.</div></div>`}
      </div>
      ${pubs.length ? `<div>
        <h3 class="muted" style="font-size:11px;letter-spacing:0.12em;text-transform:uppercase;margin:0 0 10px">Trusted publishers</h3>
        <div class="card">${pubRows}</div>
      </div>` : ""}
    </div>`;

  const byDoc = Object.fromEntries(avail.map((p) => [p.doc, p]));
  $$("[data-install]").forEach((b) => (b.onclick = () => {
    const pkg = byDoc[b.dataset.install];
    installPrompt(pkg, () => installPackage(pkg));
  }));
  $$("[data-open-btn]").forEach((b) => (b.onclick = () => openPlugin(b.dataset.openBtn, inst, "")));
  $$("[data-remove]").forEach((b) => (b.onclick = async () => {
    try { await del(`/api/plugins/${encodeURIComponent(b.dataset.remove)}`); toast("removed"); renderPlugins(); renderPluginNav(); }
    catch (e) { toast(e.message, true); }
  }));
  $$("[data-revoke]").forEach((b) => (b.onclick = async () => {
    try { await post(`/api/publishers/${encodeURIComponent(b.dataset.revoke)}/revoke`); toast("trust withdrawn"); renderPlugins(); }
    catch (e) { toast(e.message, true); }
  }));
}

/* ---- self-update ----
 *
 * The daemon does the deciding: /api/updates only lists releases this node
 * would actually run -- trusted key, good signature, right platform, strictly
 * newer, all bytes present. So the console never has to interpret whether an
 * offer is real, and an Update button that appears is one that can work.
 */
async function renderUpdateBanner() {
  let info;
  try { info = await get("/api/updates"); } catch { return; }
  const ready = (info.releases || []).filter(
    (r) => r.trusted && r.signatureOk && r.runsHere && r.newer);
  const host = $("#content");
  if (!ready.length || !host || host.querySelector(".updbar")) return;

  // Newest first, so a node several versions behind is offered the latest.
  ready.sort((a, b) => (a.version < b.version ? 1 : -1));
  const r = ready[0];

  const bar = document.createElement("div");
  bar.className = "updbar";
  bar.innerHTML = `
    <span class="badge b-cyan"><span class="dot"></span>update</span>
    <span>ph-reactor <b>${esc(r.version)}</b> is available — running ${esc(info.current)}${r.notes ? ` · ${esc(r.notes)}` : ""}</span>
    <span class="sep"></span>
    ${r.ready
      ? `<button class="btn primary sm" id="upd-go">Install &amp; restart</button>`
      : `<span class="note">fetching ${esc(r.bytesMissing)} chunks from peers…</span>`}
    ${info.auto ? `<span class="note">auto-update is on</span>` : ""}`;
  host.prepend(bar);

  const go = $("#upd-go", bar);
  if (go) go.onclick = async () => {
    go.disabled = true;
    go.textContent = "installing…";
    try {
      const out = await post("/api/updates/apply", { doc: r.doc });
      // The daemon stops itself so its supervisor starts the new binary, so
      // the console is about to lose its connection. Say that rather than let
      // it look like a failure.
      bar.innerHTML = `<span class="badge b-green"><span class="dot"></span>installed</span>
        <span>${esc(out.applied)} installed${out.replacedRunningBinary === false
          ? " to " + esc(out.installedAt) + " (not the binary this process started from)" : ""}.
        The daemon is restarting — this page will reconnect.</span>`;
    } catch (e) {
      go.disabled = false;
      go.textContent = "Install & restart";
      toast(e.message, true);
    }
  };
}

/* ---- plugin-provided sidebar entries ---- */
/*
 * A plugin declares these in its signed manifest and the daemon validates them
 * before install: at most three per plugin, no control characters, and never
 * one of the console's own names. That last rule is what stops a package
 * shipping a second "Settings" -- these entries sit among the built-in items
 * with nothing marking them as third-party, so the name has to be the guard.
 */
async function renderPluginNav() {
  const host = $("#nav-plugins");
  if (!host) return;
  let inst = [];
  try { inst = await get("/api/plugins"); } catch { host.innerHTML = ""; return; }

  const items = [];
  for (const p of inst) {
    if (!p.hasEditor) continue;
    const nav = Array.isArray(p.nav) && p.nav.length
      ? p.nav
      // A plugin that declares nothing still gets one entry under its own
      // name, so installing something always produces somewhere to go.
      : [{ label: p.name.replace(/^@[^/]*\//, ""), icon: "", view: "" }];
    for (const n of nav) items.push({ plugin: p.name, ...n });
  }

  host.innerHTML = items.map((n) => `
    <div class="nav-item" data-plugin="${esc(n.plugin)}" data-view="${esc(n.view || "")}">
      <span class="ico">${esc(n.icon || "◈")}</span> ${esc(n.label)}
    </div>`).join("");

  $$("[data-plugin]", host).forEach((el) => (el.onclick = () => {
    location.hash = "plugin/" + encodeURIComponent(el.dataset.plugin)
      + (el.dataset.view ? "/" + encodeURIComponent(el.dataset.view) : "");
  }));
  markActiveNav();
}

/* The sidebar highlight has to understand both kinds of destination. */
function markActiveNav() {
  const r = routeFromHash();
  $$(".nav-item").forEach((el) => {
    const isPlugin = el.dataset.plugin !== undefined;
    el.classList.toggle(
      "active",
      isPlugin
        ? r.plugin === el.dataset.plugin && (r.view || "") === (el.dataset.view || "")
        : !r.plugin && el.dataset.tab === r.tab
    );
  });
}

/* ---- the capability bridge ---- */
/*
 * One listener, torn down when the frame closes, answering only messages whose
 * source IS this frame's window. That check -- not the origin string -- is what
 * identifies the caller here, because the frame is sandboxed into an opaque
 * origin and therefore reports origin "null". "null" is not addressable as a
 * postMessage target, so replies necessarily go to "*"; they are safe to,
 * because postMessage delivers to the target window only, and the target window
 * is the one we just verified.
 */
let bridgeOff = null;

function openPlugin(name, installed, view) {
  const pkg = (installed || []).find((p) => p.name === name);
  const want = "#plugin/" + encodeURIComponent(name) + (view ? "/" + encodeURIComponent(view) : "");
  if (location.hash !== want) history.replaceState(null, "", want);
  const src = `${ASSET_ORIGIN}/plugin/${encodeURIComponent(name)}`;

  const wrap = document.createElement("div");
  wrap.innerHTML = `
    <div class="content-head">
      <div><h1>${esc(name)}</h1><div class="sub">${esc((pkg && pkg.description) || "plugin")}</div></div>
      <button class="btn ghost sm" id="plug-back">← All plugins</button>
    </div>
    <div class="frame-wrap">
      <div class="frame-chrome">
        <span class="badge b-violet"><span class="dot"></span>sandboxed</span>
        <span class="mono">${esc(src)}</span>
        <span class="sep"></span>
        <span>published by <b style="color:var(--text)">${esc((pkg && pkg.publisher) || "unknown")}</b></span>
      </div>
      <iframe id="plug-frame" src="${esc(src)}"
              sandbox="allow-scripts allow-forms"
              referrerpolicy="no-referrer"
              title="${esc(name)}"></iframe>
    </div>`;
  $("#content").replaceChildren(wrap);
  $("#plug-back").onclick = () => { closeBridge(); switchTab("plugins"); };

  const frame = $("#plug-frame");

  // The sandbox attribute is belt to the port separation's braces: without
  // allow-same-origin the frame gets an opaque origin, so even a console
  // misconfigured onto the asset port would still not share an origin with it.
  //
  // allow-forms is needed for an unexpected reason. A sandboxed frame without
  // it has the submit EVENT blocked, not just the navigation -- so a form that
  // only ever calls preventDefault() and posts over the bridge silently never
  // fires, which is exactly what happened the first time this ran. Granting it
  // costs nothing: the bundle's own CSP sets form-action 'none', so the browser
  // still refuses to send a form anywhere.
  const onMessage = async (ev) => {
    if (ev.source !== frame.contentWindow) return;
    if (ev.origin !== "null" && ev.origin !== ASSET_ORIGIN) return;
    const m = ev.data;
    if (!m || typeof m.id !== "number") return;

    const reply = (out) => { try { frame.contentWindow.postMessage({ id: m.id, ...out }, "*"); } catch {} };
    try {
      if (m.op === "query") {
        reply({ result: await post(`/api/plugins/${encodeURIComponent(name)}/query`, { model: m.model, filter: m.filter ?? null }) });
      } else if (m.op === "history") {
        reply({ result: await post(`/api/plugins/${encodeURIComponent(name)}/history`, { model: m.model, name: m.name, limit: m.limit ?? 50 }) });
      } else if (m.op === "action") {
        reply({ result: await post(`/api/plugins/${encodeURIComponent(name)}/action`, { model: m.model, kind: m.kind, name: m.name, payload: m.payload ?? {} }) });
      } else if (m.op === "host") {
        // Handshake: the plugin learns who it is and which theme to wear. No
        // node identity, no peer list, no configuration -- a plugin has no
        // business knowing those and does not need them to render.
        // `view` is which of the plugin's own screens the operator asked for,
        // taken from the sidebar entry they clicked. It was validated at
        // install time to be a plain identifier.
        reply({ result: { plugin: name, publisher: (pkg && pkg.publisher) || "", theme: "dark", view: view || "" } });
      } else {
        reply({ error: `unknown operation: ${String(m.op)}` });
      }
    } catch (e) {
      reply({ error: e.message || String(e) });
    }
  };

  closeBridge();
  window.addEventListener("message", onMessage);
  bridgeOff = () => window.removeEventListener("message", onMessage);
}

function closeBridge() { if (bridgeOff) { bridgeOff(); bridgeOff = null; } }

/* ============================ DISPATCH ============================ */
const RENDER = {
  overview: renderOverview,
  documents: renderDocuments,
  types: renderTypes,
  folders: renderFolders,
  groups: renderGroups,
  plugins: renderPlugins,
  settings: renderSettings,
  profile: renderProfile,
};
function render() { closeBridge(); (RENDER[state.tab] || renderOverview)(); }

$$(".nav-item").forEach((n) => (n.onclick = () => switchTab(n.dataset.tab)));
window.addEventListener("hashchange", applyRoute);
renderPluginNav();
applyRoute();
renderUpdateBanner();
setInterval(renderUpdateBanner, 5 * 60 * 1000);
</script>
</body>
</html>
