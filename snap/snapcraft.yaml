name: ph-reactor
base: core24
version: "1.0.0"
summary: Native Powerhouse reactor - event-sourced document store + P2P drive sync
description: |
  The ph-reactor is a native event-sourced document store with libp2p drive
  sync, running as a Linux status-bar background daemon. It keeps your local
  documents in sync with remote Powerhouse drives (for example a knowledge
  vault group), shows a tray icon with a per-drive menu, and auto-installs
  missing document model packages from the registry.
license: MIT
confinement: classic
grade: stable

# Classic confinement is required: the reactor runs as a user-session daemon
# that (a) needs broad network access (libp2p TCP/QUIC + the registry), (b)
# publishes a StatusNotifierItem on the *session* D-Bus for the tray icon,
# and (c) keeps its store under the user's home. A classic snap gives it the
# session bus and home access a strict snap would restrict.
assumes:
  - classic

# A user-session desktop app, started at login and shown in the tray.
# `restart-condition: always` keeps it alive if it ever exits.
apps:
  ph-reactor:
    command: bin/ph-reactor run
    desktop: ph-reactor.desktop

parts:
  ph-reactor:
    plugin: dump
    source: .
    # The build step does the actual compilation; `dump` then ships the
    # produced binary and the .desktop file.
    override-build: |
      set -eux
      cargo build --release --locked
      install -Dm755 target/release/ph-reactor $SNAP/bin/ph-reactor
      install -Dm644 packaging/ph-reactor.desktop \
        $SNAP/share/applications/ph-reactor.desktop

# --- Plugs ---------------------------------------------------------------
plugs:
  # libp2p listens on a TCP/QUIC port and dials peers.
  network:
  network-bind:
  # The tray icon is a StatusNotifierItem on the session D-Bus.
  dbus:
  # The store + identity live under ~/.ph/reactor.
  home:
